    <script type="text/javascript" src="../_js/jquery-3.1.0.min.js"></script>

    <script type="text/javascript">
        
        var delay = 63;
        var counter = 0;
        var LTS;
        var FRAMETHREAD;
        var MOUSEHANDLER;
        
        function _changeClock () {
            //console.log ( 'changeclock' );
            
            counter ++;
            if ( Math.random () * counter > delay ) {
                counter = 0;
                _setClock ();
            }
        }
        
        function _setClock () {
            var d = new Date();
            var t = d.getTime ();

            var time = 1588825173364;

            //console.log ( t );
            $ ( "#clock" ).html ( "-" + String ( ( time - t ) / 3.33 ) + "-" );            
        }
        
        function pageIntro () {
            console.log ( "pageintro" );
            var html = "<p style='font-family: courier; font-size: 12px;text-align:center;color:white; position: absolute; top: 50%; left: 50%; margin: 0px; transform: translateY(-50%) translateX(-50%);'>";
            html += "LyranRenegades.net";
            html += "<br/><span style='color:#ff0000'>>> tune in at summer 2020</span>";
            html += "<br/><span id='clock' style='color:#cc00ff'>---</span>";
            html += "</p>";
            
            $ ( "#parentdiv" ).append ( html );
            _setClock ();
            FRAMETHREAD = new FrameThread ();
            FRAMETHREAD.startLooping ( true );
            
            $ ( document ).on ( "frameTick", $.proxy ( this, "_changeClock" ) );
        }
        
        window.addEventListener ( "load", function () {	
            _startLetters ();
             /*pageIntro ();*/ 
         }, false );
    
    
    
    
         function _startLetters () {
            LTS = new LettersToStacey (); 
            MOUSEHANDLER = new MouseHandler ();
             
            var html = "<p id='lts' style='font-family: roboto_mono_thin; font-size: 12px;text-align:left;color:white; position: absolute; top: 15%; left: 15%; margin: 0px; transform: translateY(-8%) translateX(-8%);'>";
            //html += "<br/><span style='color:#ff0000'>>> tune in at summer 2020</span>";
            html += "<br/><span id='ltsTitle' style='color:#c0c0b0;'>---</span>";
            html += "<br/><span id='ltsText' style='color:#f0f0e0'>---</span>";
            html += "<br/><span id='ltsFooter' style='color:#f0f0e0;float:right'>---</span>";
            html += "<br/><br/>";
            
            html += "<br/><br/><br/><br/>";
            
            html += "<span id='buttons'>"; 
            html += "<span id='past'><i>< eerder</i></span>";
            html += "<span id='future' style='float:right;'><i>later ></i></span>";
            html += "<br/><br/></span>";
            
            html += "</p>";
            
            $ ( "#parentdiv" ).append ( html );
             
            this._enableButton ( "past", false, false );
            this._enableButton ( "future", true, false );
             
            $ ( "#lts" ).css ({
                cursor: "default"
            });
            
            $ ( "#lts" ).addClass ( "unselectable" );
             _openLetter ( 1 );
             
             
         }
    
         function _openLetter ( x ) {
             var html = LTS.getLetter ( x );
             
             $ ( "#ltsTitle" ).html ( html.title );  
             $ ( "#ltsText" ).html ( html.text );  
             $ ( "#ltsFooter" ).html ( html.footer );  
             
         }
         
         this._enableButton = function ( spanid, b ) {
            //MAIN.log ( "textparser enable button for " + spanid + ", " + b );
            var cursor = "default";
            $ ( "#" + spanid ).off ( MOUSEHANDLER.MOUSEOVER, $.proxy ( this, "_WLmouseOver" ) );
            $ ( "#" + spanid ).off ( MOUSEHANDLER.MOUSEOUT, $.proxy ( this, "_WLmouseOut" ) );
            $ ( "#" + spanid ).off ( MOUSEHANDLER.CLICK, $.proxy ( this, "_WLmouseClick" ) );         
            if ( b ) {
                $ ( "#" + spanid ).on ( MOUSEHANDLER.MOUSEOVER, $.proxy ( this, "_WLmouseOver" ) );
                $ ( "#" + spanid ).on ( MOUSEHANDLER.MOUSEOUT, $.proxy ( this, "_WLmouseOut" ) );
                $ ( "#" + spanid ).on ( MOUSEHANDLER.CLICK, $.proxy ( this, "_WLmouseClick" ) );                
                cursor = "pointer";
            }

            var opacity = b? ".8" : ".5";
            //var textdecoration = selected? "underline" : "none";
            //var fontstyle = selected? "normal" : "italic";

            $ ( "#" + spanid ).css ({
                opacity: opacity,
                /*textDecoration: textdecoration,*/
                /*fontStyle: fontstyle,*/
                cursor: cursor
            });

        };

        this._WLmouseOver = function ( e ) {
            //MAIN.log ( "_WLmouseOver " + e.currentTarget.id );
            $ ( "#" + e.currentTarget.id ).css ( { 
                //opacity: this.wl_opacity_over,
                //textDecoration: "underline"
                opacity: "1"
            });            
        };
        this._WLmouseOut = function ( e ) {
            $ ( "#" + e.currentTarget.id ).css ( { 
                //opacity: this.wl_opacity_out,
                //textDecoration: "none"
                opacity: ".8"
            });            
        };    
        this._WLmouseClick = function ( e ) {
            //var word = $ ( e.currentTarget ).text ();
            //NAVIGATIONMANAGER.openWordLink ( e.currentTarget.id, word );
            console.log ( "going to the " + e.currentTarget.id );

            //this._WLmouseOut ( e );
        };           
    
         
    
    
    </script>
