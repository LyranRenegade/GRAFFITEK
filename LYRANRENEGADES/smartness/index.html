                ];

                function start () {
                    MOUSEHANDLER = new MouseHandler ();
                    MOUSEHANDLER.initialize ();                    
                    
                    window.addEventListener ( "resize", function () {	
                            _resizeEvent ();
                     }, false );

        
                    var q = getUrlVars ();
                    var i = 0;
                    if ( q.i ) {
                        console.log ( "query: " + q + "i: " + i );
                        i = q.i;
                    }
                    _buildHtml ( i );
                    
                    _resizeEvent ();
                   
                    $ ( document ).keyup ( $.proxy ( this, "_keyUp" ));
                }

                function _keyUp ( e ) {
                    console.log ( "keyup: " + e.keyCode );
                    if ( e.keyCode == "37" ) {
                        this.goBack ();
                    }
                    if ( e.keyCode == "39" ) {
                        this.goForward ();
                    }                    
                }

		function _buildHtml ( index ) {
			var w = window.innerWidth;
			var h = window.innerHeight;
			this.index = index;
			
                        var hcHeight = this.headerheight;
                        HEADERCANVAS = new HeaderCanvas ();
                        var hc = HEADERCANVAS.create ( "hc", w, hcHeight );
                        $ ( "#parentdiv" ).append ( hc );
                        
                        
                        this.butclrDef = HEADERCANVAS.headercolorD;
                        this.butclrDef2 = HEADERCANVAS.headercolor;
                        this.butclrSel = HEADERCANVAS.headercolor;
                        this.butclrSel2 = HEADERCANVAS.headercolorD;
                
                
			var divheader = "<div style='width:100%" + "" + ";margin:0px;top:" + hcHeight + "px;position:absolute;'>";
                        //divheader += "<span style=\"font-family:'lato_black';color:#c91053;font-size:80;\"><i>Lyran<font style='color:#5310c9'>Renegades</font></i></span><br/>";                        
                        //divheader += "<span style=\"font-family:'lato_black';color:#666666;font-size:34;\">EARTH @2021: An Apocalyptical Tale about SMARTNESS</span>";
                        //divheader += "<hr id='hrtop' color='#333333'>";
                        divheader += "<div style='width: 50%; margin: 0 auto;'>";
                        divheader += "<span id='buttonbar' style=\"font-family:'lato_bold';color:#ffcc33;font-size:12;\"></span>";
                        divheader += "</div>";
                        //divheader += "<hr id='hrbottom' color='#333333'>";
                        divheader += "</div>";
                        
                        $ ( "#parentdiv" ).append ( divheader );
			//_addBreaks ( 2 );
                        
                        var img_id = this.indices [ index ].img_id;
                        
                        
                        var imgHTML = "<div id='imagediv' style='position:absolute;top:141px;display:table-cell;width:100%;vertical-align:middle;margin:0;left:-1px;'>";
                        imgHTML += "<img id='mainimage' src='COLLECTION1/Page" + img_id + ".jpg' style='width:100%;border-top: 1px solid " + this.lightcolor + ";border-bottom: 1px solid " + this.lightcolor + ";'/>";
                        imgHTML += "</div>";
                        
                        $ ( "#parentdiv" ).append ( imgHTML );

                        var dateHTML = "<p id='datespan' style='text-align:left;position:absolute;width:100%;font-family:lato_regular;color:" + this.lightcolor + ";font-size:10;'>DATE</p>";
                        $ ( "#parentdiv" ).append ( dateHTML );
                        var contHTML = "<p id='contspan' style='text-align:right;position:absolute;width:100%;font-family:lato_regular;color:" + this.lightcolor + ";font-size:10;'>DATE2</p>";
                        $ ( "#parentdiv" ).append ( contHTML );
                        
                        $ ( "#mainimage" ).on ( "load", function() {
                            console.log ( "IMAGE LOADED" );
                            _setDatePosition ();
                            //$ ( this ).stop ( true, true ).fadeOut ();
                            $ ( "#mainimage" ).fadeIn ( 500, false );
                        });
                                
                
                        /*.each ( function () {
                            if ( this.complete ) {
                                $(this).load(); // For jQuery < 3.0 
                                $(this).trigger('load'); // For jQuery >= 3.0 
                            }
                        });                        */
                        

                        
                        FOOTERCANVAS = new FooterCanvas ();
                        var fc = FOOTERCANVAS.create ( "fc", w, this.footerheight );
                        $ ( "#parentdiv" ).append ( fc );
                        
                        
                        var i;
                        var il = this.indices.length;
                        var butHTML, butid;
                        
                        for ( i = 0; i < il ; i ++ ) {
                            butid = "but_" + this.indices [ i ].img_id;
                            butHTML = "<span id='" + butid + "'>" + this.indices [ i ].img_id + "</span>&nbsp;";
                            $ ( "#buttonbar" ).append ( butHTML );
                            setButtonAble ( "#" + butid, true, false );
                            this.buttonids.push ( butid );
                        }
                            
                        $ ( "#buttonbar" ).append ( "<span id='BACK'><</span>&nbsp;" );
                        $ ( "#buttonbar" ).append ( "<span id='FORWARD'>></span>&nbsp;" );
                        $ ( "#buttonbar" ).addClass ( "unselectable" );
                        this._setImage ( "but_" + img_id );
                        //this._setButtonSelect ( "but_" + img_id );
			
                        $ ( "#BACK" ).css ( {
                            position: "relative",
                            top: "4px"
                        });
                        $ ( "#FORWARD" ).css ( {
                            position: "relative",
                            top: "4px"
                        });                        
                        $ ( "#buttonbar" ).css ( {
                            position: "relative",
                            top: "-6px"
                        });     
                        $ ( "#hrbottom" ).css ( {
                            position: "relative",
                            top: "-3px"
                        });      
                        $ ( "#hrtop" ).css ( {
                            position: "relative",
                            top: "4px"
                        });        
                        
                                                
		}		

                this.setButtonAble = function ( bid, b, backfwd ) {
                    $ ( bid ).off ( MOUSEHANDLER.MOUSEOVER );
                    $ ( bid ).off ( MOUSEHANDLER.MOUSEOUT );
                    $ ( bid ).off ( MOUSEHANDLER.MOUSEDOWN );
                    var cursor = "default";
                    var clr = b? this.butclrDef : this.butclrSel;
                    var td = b? "none" : "underline";
                    td = "none";
                    var fs = 22;
                    
                    if ( backfwd ) {
                        td = "none";
                        clr = b? this.butclrDef : this.butclrSel2;
                        fs = 28;
                    }
                    
                    if ( b ) {
                        cursor = "pointer";
                        $ ( bid ).on ( MOUSEHANDLER.MOUSEOVER, $.proxy ( this, "_mouseOver" ) );
                        $ ( bid ).on ( MOUSEHANDLER.MOUSEOUT, $.proxy ( this, "_mouseOut" ) );
                        $ ( bid ).on ( MOUSEHANDLER.MOUSEDOWN, $.proxy ( this, "_mouseDown" ) );
                    }

                    $ ( bid ).css ( "cursor", cursor );
                    $ ( bid ).css ( "fontSize", fs );
                    $ ( bid ).css ( "color", clr );
                    if ( !backfwd ) {
                        $ ( bid ).css ( "textDecoration", td );
                        
                    }
                };

    
                this._mouseOver = function ( e ) {
                    var target = e.target || e.srcElement;
                    var id = target.id;
                    if ( id === "FORWARD" || id === "BACK" ) {
                        $ ( "#" + id ).css ( {
                           color: this.butclrDef2
                        });
                    }
                    else {
                        $ ( "#" + id ).css ( {
                            color: this.butclrSel
                           //textDecoration: "underline" 
                        });
                    }
                };
    
                this._mouseOut = function ( e ) {
                    var target = e.target || e.srcElement;
                    var id = target.id;
                    if ( id === "FORWARD" || id === "BACK" ) {
                        $ ( "#" + id ).css ( {
                           color: this.butclrDef
                        });
                    }
                    else {                    
                        $ ( "#" + id ).css ( {
                            color: this.butclrDef
                           //textDecoration: "none" 
                        });
                    }
                };
    
                this._mouseDown = function ( e ) {
                    var target = e.target || e.srcElement;
                    var id = target.id;
                    if ( id === "FORWARD" ) {
                        goForward ( e );
                    }
                    else if ( id === "BACK" ) {
                        goBack ( e );
                    }
                    else {                         
                        _setImage ( id );
                    }
                };    
    
                this.goForward = function ( e ) {
                    var i;
                    var il = this.indices.length;
                    var butid = "but_";
                    for ( i = 0; i < il; i ++ ) {
                         if ( this.indices [ i ].img_id == this.activeImgId ) {
                             break;
                         }
                     }
                     if ( i == ( il - 1 ) ) {
                         console.log ( "cannot go forward from here" );
                     }
                     else {
                        butid += this.indices [ i + 1 ].img_id;
                        _setImage ( butid );
                        if ( e != null ) if ( i + 1 < il - 1 ) this._mouseOver ( e );
                    }
                }
                
                this.goBack = function ( e ) {
                    var i;
                    var il = this.indices.length;
                    var butid = "but_";
                    for ( i = 0; i < il; i ++ ) {
                        if ( this.indices [ i ].img_id == this.activeImgId ) {
                            break;
                        }
                    }
                    if ( i == 0 ) {
                        console.log ( "no going back from here" );
                    }
                    else {
                        butid += this.indices [ i - 1 ].img_id;
                        _setImage ( butid );
                        if ( e != null ) if ( i - 1 > 0 ) this._mouseOver ( e );
                        
                    }
                }                
    
    
    
                this._setButtonSelect = function ( but_id ) {
                    console.log ( "setbuttonselect"+ but_id );
                    var i;
                    var bl = this.buttonids.length;
                    var bid2;
                    for ( i = 0; i < bl; i ++ ) {
                        bid2 = this.buttonids [ i ];
                        this.setButtonAble ( "#" + bid2, ( but_id !== bid2 ), false );
                    }
                    
                    this.setButtonAble ( "#BACK", ( but_id !== this.buttonids [ 0 ] ), true );
                    this.setButtonAble ( "#FORWARD", ( but_id !== this.buttonids [ bl - 1 ] ), true );
                    
                };
                
    
		function _setImage ( but_id ) {
                    var li = but_id.lastIndexOf ( "_" );
                    var img_id = but_id.substring ( li + 1 );
                    var img = _getImageFromId ( img_id );
                    
                    console.log ( "placeimage"+ img_id + " ver: " + img.ver );
                    
                    $ ( "#mainimage" ).css ( "display", "none" );
                    //$ ( "#mainimage" ).fadeOut ( 500, false );
                    $ ( "#mainimage" ).attr ( "src", "COLLECTION1/Page" + img_id + ".jpg?ver=" + img.ver );
                    this.activeImgId = img_id;
                    this._setButtonSelect ( but_id );
                    
                    
                    if ( img != null ) {
                        FOOTERCANVAS.setTitle ( img.title );
                        
                        $ ( "#datespan" ).html ( "lyranrenegades.net // " + img.month + "-" + img.year );
                        
                    }
                    var cont = "";
                    if ( img_id == this.indices [ this.indices.length - 1 ].img_id ) {
                        cont = "..to be continued"
                    }
                    $ ( "#contspan" ).html ( cont );
                    
		};
		

                function _getImageFromId ( id ) {
                    var i;
                    var il = this.indices.length;
                    for ( i = 0; i < il; i ++ ) {
                        if ( this.indices [ i ].img_id == id ) {
                            return this.indices [ i ];
                        }
                    }
                    return null;
                };
                






		
		function _resizeEvent () {
                    if ( HEADERCANVAS !== null ) {
                        HEADERCANVAS.redraw ( window.innerWidth );
                    }
                    if ( FOOTERCANVAS !== null ) {
                        FOOTERCANVAS.redraw ( window.innerWidth );
                    }
                    FOOTERCANVAS.canvas.style.top = window.innerHeight - 100;
                    
                    if (  $( "#mainimage" ).height () > 2 ) {
                        _setDatePosition ();
                    }
                    
                    return;
			var w = window.innerWidth;
			var h = window.innerHeight;
			console.log ( "w / h: " + w + " / " + h );
                        
                        $ ( "#imagediv" ).css ( {
                                height: h - this.headerheight
                        } );
		
		}
                
                function _setDatePosition () {
                    var p = $( "#imagediv" ).position ();
                    var dt = p.top + $( "#mainimage" ).height () + 2;
                    console.log ( "image h: " + $( "#mainimage" ).height () );
                    
                    $ ( "#datespan" ).css ( {
                        top: dt + "px"
                    });                    
                    $ ( "#contspan" ).css ( {
                        top: dt + "px"
                    });                       
                    
                }
